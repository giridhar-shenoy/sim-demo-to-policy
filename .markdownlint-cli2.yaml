config:
  MD013: false   # long lines: tables and prose wrap differently
  MD033: false   # inline HTML: side-by-side GIFs in the README
  MD060: false   # table pipe alignment: tables are generated by scripts
  MD024:
    siblings_only: true
ignores:
  - ".venv/**"
  - "third_party/**"
  - "outputs/**"
  - "datasets/**"
  - "experiments/**"   # archived research write-ups, kept as written
