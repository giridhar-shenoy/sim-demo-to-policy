[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdp"
version = "0.2.0.dev0"
description = "Simulated pick-and-place demonstrations to an ACT policy in MuJoCo + LeRobot, with a held-out eval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Giridhar J Shenoy" }]
# Exact versions used for the published numbers live in requirements.lock;
# these are the direct pins.
dependencies = [
  "mujoco==3.17.0",
  "gymnasium==1.4.0",
  "lerobot[dataset,training]==0.6.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "imageio>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3", "pre-commit>=4", "mypy==2.4.1"]
diffusion = ["lerobot[diffusion]==0.6.1"]

[project.scripts]
sdp = "sdp.cli:main"

[tool.setuptools.packages.find]
include = ["sdp*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# experiments/ holds archived research scripts with their own conventions (sys.path
# imports, notebook-style layout); the package, scripts and tests are linted in full.
extend-exclude = ["third_party", "outputs", "datasets", "experiments"]
force-exclude = true  # also honour the excludes when pre-commit passes file names

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
# Type-checked: the smallbc policy package. The rest of sdp predates the mypy setting.
python_version = "3.12"
files = ["sdp/policies"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than ~30 s on a laptop CPU"]
